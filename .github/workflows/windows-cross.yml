name: Build RoFlow Windows (cross)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "scripts/**"
      - "src-tauri/**"
      - "ui-studio/**"
      - "web/**"
      - "tools/checks/**"
      - ".github/workflows/windows-cross.yml"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows-cross:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross-build system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm nsis

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Project scope contract
        run: python tools/checks/roflow_project_scope_check.py

      - name: Safe AI Sync source contract
        run: python tools/checks/roflow_safe_sync_check.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install cargo-xwin
        run: cargo install --locked cargo-xwin

      - name: Install frontend dependencies
        run: npm install

      - name: Prepare RoFlow assets
        run: npm run prepare:roflow

      - name: Cross-build Windows NSIS installer
        env:
          ROFLOW_BUILD_SHA: ${{ github.sha }}
        run: npm run tauri build -- --runner cargo-xwin --target x86_64-pc-windows-msvc

      - name: Upload Windows installer and portable executable
        uses: actions/upload-artifact@v4
        with:
          name: RoFlow-Windows-Cross
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/roflow.exe
          if-no-files-found: error
